body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.app{max-width:560px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tabbar) + 110px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:20px 12px}
.top .date{font-size:.82rem;color:var(--ink-2);font-weight:700;letter-spacing:.02em;margin:0 0 2px}
.top .date::first-letter{text-transform:uppercase}
.top h1{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:2.15rem;line-height:1.05;margin:0;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.top h1 svg{width:26px;height:26px;color:var(--accent);flex:none}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.iconbtn svg{width:21px;height:21px}

h2{font-family:var(--f-display);font-weight:600;font-size:1.2rem;margin:0;letter-spacing:-.005em}
h2 em{font-style:italic;font-weight:500}
.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.meta{font-size:.84rem;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
.label{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:1rem;color:var(--ink-2);margin:8px 0 -2px 4px}
.label::first-letter{text-transform:uppercase}

.summary{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px}
.summary span{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 12px;font-size:.84rem;font-weight:800}
.summary svg{width:15px;height:15px}

/* barres colorées */
.list{display:flex;flex-direction:column;gap:8px}
.bar,.evwrap{--c:var(--gris);--ci:var(--gris-ink)}
.c-etudes{--c:var(--mint);--ci:var(--mint-ink)}
.c-perso{--c:var(--rose);--ci:var(--rose-ink)}
.c-pro{--c:var(--lilas);--ci:var(--lilas-ink)}
.c-sante{--c:var(--ciel);--ci:var(--ciel-ink)}
.c-maison{--c:var(--sauge);--ci:var(--sauge-ink)}
.c-courses{--c:var(--beurre);--ci:var(--beurre-ink)}
.c-note{--c:var(--beurre);--ci:var(--beurre-ink)}
.bar{display:flex;align-items:center;gap:12px;background:var(--c);color:var(--ci);border-radius:20px;padding:8px 8px 8px 10px;min-height:62px}
.bar.c-etudes,.bar.c-perso,.bar.c-pro,.bar.c-sante,.bar.c-maison,.bar.c-courses,.bar.c-note{background:var(--c);color:var(--ci)}
.ico{flex:none;width:42px;height:42px;border-radius:15px;background:var(--surface);display:grid;place-items:center;color:var(--ci,var(--accent))}
.ico svg{width:23px;height:23px}
.bar .main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 0;display:flex;flex-direction:column;gap:1px;color:inherit}
.bar .title{font-weight:800;color:var(--ink);overflow-wrap:anywhere}
.bar .sub{font-size:.83rem;font-weight:700;overflow-wrap:anywhere}
.bar .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--surface);color:var(--ci,var(--ink-2));white-space:nowrap}
.tag svg{width:12px;height:12px}
.tag.hot{background:var(--hot);color:var(--surface)}
.check{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;color:var(--ci)}
.check svg{width:20px;height:20px;opacity:.28;transition:opacity .15s}
.check:hover svg,.check:focus-visible svg{opacity:.8}
.check.on{background:var(--ci);color:var(--c)}
.check.on svg{opacity:1}
.x{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--ci,var(--ink-2));display:grid;place-items:center;opacity:.7}
.x svg{width:17px;height:17px}
.strike .title{text-decoration:line-through;opacity:.6}
.evwrap{background:var(--c);border-radius:20px}
.evwrap .bar{background:transparent}
.prep{display:flex;flex-direction:column;gap:2px;margin:-2px 0 0 62px;padding-bottom:8px}
.prep button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 4px;text-align:left;font-size:.9rem;font-weight:700;color:var(--ink);min-height:36px}
.prep .box{width:20px;height:20px;border-radius:7px;border:2px solid var(--ci);flex:none;display:grid;place-items:center}
.prep .box svg{width:13px;height:13px;opacity:0}
.prep button[aria-pressed="true"] .box{background:var(--ci);color:var(--c)}
.prep button[aria-pressed="true"] .box svg{opacity:1}
.prep button[aria-pressed="true"] span:last-child{text-decoration:line-through;opacity:.55}

.card{background:var(--surface);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.link{background:none;border:0;color:var(--accent);font-weight:800;font-size:.88rem;padding:6px 0}
.empty{color:var(--ink-2);font-size:.92rem;padding:4px 4px;margin:0}
.emptybig{background:var(--surface);box-shadow:var(--shadow);border-radius:26px;padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--ink-2)}
.emptybig p{margin:0;max-width:34ch}
.emptybig .art{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.emptybig .art svg{width:34px;height:34px}
.alert{display:flex;gap:12px;align-items:center;background:var(--hot-soft);color:var(--hot);border-radius:20px;padding:12px 14px;font-weight:800;font-size:.9rem;border:0;text-align:left;width:100%}
.alert svg{width:22px;height:22px;flex:none}

/* habitudes */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.habit{border:0;background:var(--bg);border-radius:20px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-2);position:relative;min-width:0}
.habit .ico{background:var(--surface);color:var(--ink-2);box-shadow:var(--shadow)}
.habit span.n{font-size:.78rem;font-weight:800;line-height:1.2;text-align:center;color:var(--ink);overflow-wrap:anywhere}
.habit small{font-size:.68rem;font-weight:800;color:var(--ink-2);min-height:1em}
.habit[aria-pressed="true"]{background:var(--mint)}
.habit[aria-pressed="true"] .ico{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.habit[aria-pressed="true"] small{color:var(--mint-ink)}
.progress{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.progress i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .3s}

/* notes */
.composer{display:flex;flex-direction:column;gap:8px}
.composer textarea{min-height:88px}
.note{--c:var(--surface);background:var(--surface);border-radius:20px;padding:12px 12px 12px 14px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow)}
.note.rem{--c:var(--beurre);--ci:var(--beurre-ink);background:var(--beurre);box-shadow:none}
.note.rem.hotn{--c:var(--hot-soft);--ci:var(--hot);background:var(--hot-soft)}
.note .main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;display:flex;flex-direction:column;gap:4px}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);font-weight:700}
.note .when{font-size:.76rem;font-weight:800;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.note.done .txt{text-decoration:line-through;opacity:.55}

/* candidatures */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stats div{background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:10px 4px;text-align:center}
.stats b{display:block;font-family:var(--f-display);font-size:1.4rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:.68rem;font-weight:800;color:var(--ink-2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;text-decoration:none}
.btn.secondary{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--hot-soft);color:var(--hot)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:5px}
.seg button{border:0;background:transparent;border-radius:999px;min-height:40px;font-weight:800;font-size:.86rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.addline{display:flex;gap:8px}
.addline input{flex:1;min-width:0}
input[type=text],input[type=url],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:50px;border:1.5px solid transparent;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:10px 14px;font-size:16px;font-weight:600}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:100px;resize:vertical}
.ings{display:flex;flex-wrap:wrap;gap:6px}
.ing{font-size:.8rem;font-weight:800;padding:4px 10px;border-radius:999px;border:1.5px solid transparent}
.ing.home{background:var(--accent);color:var(--accent-ink)}
.ing.buy{background:var(--beurre);color:var(--beurre-ink)}
.ing.miss{border-color:var(--line);border-style:dashed;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;font-weight:700;color:var(--ink-2);padding:0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:5px;display:inline-block}
.recipe h3{font-family:var(--f-display);font-weight:600;font-size:1.08rem;margin:0}

.fab{position:fixed;right:max(max(18px,env(safe-area-inset-right,0px)),calc(50% - 262px));bottom:calc(var(--tabbar) + 30px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 8px 22px rgba(44,136,101,.32);min-height:54px;padding:0 22px}

nav.tabs{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:7;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:1px;height:var(--tabbar);background:var(--surface);border-radius:28px;box-shadow:0 6px 24px rgba(29,58,46,.13);padding:5px}
nav.tabs button{border:0;background:none;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.64rem;font-weight:800;color:var(--ink-2);position:relative;min-width:0;padding:0}
nav.tabs svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.badge{position:absolute;top:3px;left:calc(50% + 5px);min-width:17px;height:17px;border-radius:9px;background:var(--hot);color:var(--surface);font-size:.64rem;font-weight:800;display:grid;place-items:center;padding:0 4px}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(17,30,24,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:30px 30px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:10px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet h3{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:1.6rem;margin:0}
.sheet .lead{margin:-6px 0 0;color:var(--ink-2);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:.84rem;font-weight:800;color:var(--ink-2);padding-left:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two > *{min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:8px 14px;font-weight:800;font-size:.86rem;min-height:40px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.pills button svg{width:18px;height:18px}
.pills button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pills.cats button[data-val="Perso"][aria-pressed="true"]{background:var(--rose-ink);color:var(--rose)}
.pills.cats button[data-val="Pro"][aria-pressed="true"]{background:var(--lilas-ink);color:var(--lilas)}
.pills.cats button[data-val="Santé"][aria-pressed="true"]{background:var(--ciel-ink);color:var(--ciel)}
.pills.cats button[data-val="Autre"][aria-pressed="true"]{background:var(--gris-ink);color:var(--gris)}
.ipick summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:.84rem;font-weight:800;color:var(--ink-2);padding-left:4px}
.ipick summary::-webkit-details-marker{display:none}
.ipick summary .ico{width:38px;height:38px;box-shadow:var(--shadow);color:var(--accent)}
.ipick summary u{color:var(--accent);text-decoration:none}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;margin-top:10px}
.igrid button{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;height:48px;display:grid;place-items:center;color:var(--ink-2);font-size:.7rem;font-weight:800}
.igrid button svg{width:24px;height:24px}
.igrid button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.hint{font-size:.8rem;color:var(--ink-2);margin:0;padding-left:4px;font-weight:600}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.steps b{color:var(--ink)}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:.88rem;width:max-content;max-width:calc(100% - 36px)}
.toast button{background:var(--bg);color:var(--ink);border:0;border-radius:999px;font-weight:800;padding:6px 14px;min-height:36px}
details.done summary{cursor:pointer;font-family:var(--f-display);font-style:italic;color:var(--ink-2);padding:8px 4px;list-style:none}
details.done summary::-webkit-details-marker{display:none}
details.done .list{margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
"use strict";
const STANDALONE = !!window.SAPIN_STANDALONE;
const SHORTCUT = "Sapin Alarme";
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const today = () => iso(new Date());
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const diff = s => Math.round((parseD(s) - parseD(today())) / 86400000);
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return iso(d); };
const fmtDay = s => parseD(s).toLocaleDateString("fr-FR", {weekday:"short", day:"numeric", month:"short"});
const fmtLong = s => parseD(s).toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"});

function dayName(s){ const n = diff(s); return n === 0 ? "aujourd'hui" : n === 1 ? "demain" : n === -1 ? "hier" : n > 1 && n < 7 ? weekday(s) : fmtLong(s); }
function rel(s){

  return {t:`Dans ${n} j`, hot:false};
}
const minTxt = m => !m ? "" : m < 60 ? `${m} min` : `${Math.floor(m/60)} h${m%60 ? " " + pad(m%60) : ""}`;
const FREQ = [[0,"Une seule fois"],[1,"Chaque jour"],[2,"Tous les 2 jours"],[3,"Tous les 3 jours"],[7,"Chaque semaine"],[14,"Toutes les 2 semaines"],[30,"Chaque mois"]];

const ACTIVE = ["À envoyer","Envoyée","Relancée","Entretien"];
const HABIT_SUGG = [["Brosser les dents · matin","dent"],["Brosser les dents · soir","dent"],["Prendre une douche","douche"],["Faire son lit","lit"],["Boire de l'eau","eau"],["Se démaquiller","soin"],["Skincare du soir","soin"],["Prendre ses vitamines","pilule"],["Aérer la chambre","soleil"],["Ranger 10 min","menage"],["Bouger 20 min","sport"],["Lire 10 pages","livre"],["Préparer son sac","mallette"],["Se coucher avant minuit","lune"]];

/* ---------- icônes ---------- */
const sv = (inner, w = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const F = 'fill="currentColor" fill-opacity=".16"';
const ICONS = {
  aspi:["Aspirateur", `<path d="M4.5 19.5h7a3.2 3.2 0 0 0 0-6.4H8a3.5 3.5 0 0 0-3.5 3.5z" ${F}/><circle cx="7" cy="19.5" r="1.3" fill="currentColor"/><path d="M11.5 13.1c2.6 0 4.5-1.6 4.5-4.4V4M14 4h5.5"/>`],

/* ---------- état et stockage ---------- */
const EMPTY = () => ({deadlines:[], events:[], chores:[], items:[], recipes:[], jobs:[], habits:[], habitLog:{}, notes:[]});
const KEYS = ["deadlines","events","chores","items","recipes","jobs","habits","notes"];
let S = EMPTY();
const LS = "sapin.state.v1";
function normalize(o){ const s = EMPTY(); for (const k of KEYS) if (Array.isArray(o && o[k])) s[k] = o[k]; if (o && o.habitLog && typeof o.habitLog === "object" && !Array.isArray(o.habitLog)) s.habitLog = o.habitLog; return s; }
function hasData(s){ return KEYS.some(k => s[k].length); }
try { const raw = localStorage.getItem(LS); if (raw) S = normalize(JSON.parse(raw)); } catch(e) {}

const sync = {mode:"local", ref:null, writing:false, again:false, last:0, timer:null};
function persist(){
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e) {}
  if (sync.ref){ clearTimeout(sync.timer); sync.timer = setTimeout(flush, 500); }
}
async function flush(){
  if (!sync.ref) return;
  if (sync.writing){ sync.again = true; return; }
  sync.writing = true;
  const t = Date.now(); sync.last = t;
  try { await sync.ref.set(Object.assign({}, S, {updatedAt:t})); }
  catch(e){ toast(e && e.code === "quota_exceeded" ? "Stockage plein : supprime d'anciens éléments." : "Synchronisation impossible pour l'instant. Tes données restent sur cet appareil."); }
  sync.writing = false;
  if (sync.again){ sync.again = false; flush(); }
}
async function initRemote(){
  if (STANDALONE || !window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    sync.ref = db.doc("data/users/" + id + "/organiseur");
    const snap = await sync.ref.get();
    if (snap.exists) { S = normalize(snap.data()); try{localStorage.setItem(LS, JSON.stringify(S));}catch(e){} render(); }
    else if (hasData(S)) flush();
    sync.mode = "db";
    sync.ref.onSnapshot(s => {
      if (!s.exists || s.metadata.hasPendingWrites) return;
      const d = s.data(); if (d.updatedAt === sync.last) return;
      if (sheetOpen) return;
      S = normalize(d); try{localStorage.setItem(LS, JSON.stringify(S));}catch(e){} render();
    }, () => {});
  } catch(e) { sync.ref = null; sync.mode = "local"; }
}

/* ---------- logique ---------- */
const evTime = e => at(e.date, e.time);
const evPast = e => { const end = evTime(e); end.setHours(end.getHours() + (e.time ? 2 : 24)); return end < new Date(); };
function evReminding(e){
  if (evPast(e)) return false;
  const lead = Math.max(0, ...(e.remind || []).map(r => (REMIND.find(x => x[0] === r) || [0,0,0])[2]));
  return (lead > 0 && (evTime(e) - new Date()) / 60000 <= lead) || diff(e.date) === 0;
}
const prepLeft = e => (e.prep || []).filter(p => !p.done).length;
const jobDue = j => ACTIVE.includes(j.status) && j.status !== "Entretien" && j.status !== "À envoyer" && j.follow && diff(j.follow) <= 0;
const noteDue = n => n.remind && !n.done && at(n.remind.date, n.remind.time) <= endOfToday();
const endOfToday = () => { const d = new Date(); d.setHours(23,59,59,0); return d; };
const habitDone = (d, id) => (S.habitLog[d] || []).includes(id);
function streak(id){ let n = 0, d = today(); if (!habitDone(d, id)) d = addDays(d, -1); while (habitDone(d, id) && n < 400){ n++; d = addDays(d, -1); } return n; }
function fmtStamp(isoStr){ const d = new Date(isoStr); const day = iso(d); const n = diff(day);
  const dd = n === 0 ? "Aujourd'hui" : n === -1 ? "Hier" : d.toLocaleDateString("fr-FR", {weekday:"short", day:"numeric", month:"short"}); return `${dd} · ${hh(hm(d))}`; }
const remTxt = r => `${dayName(r.date)} ${hh(r.time)}`;

/* ---------- ingrédients ---------- */
const words = s => nrm(s).replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w => w && !["de","du","des","la","le","les","d","l","un","une","au","aux","g","kg","ml","cl","x"].includes(w) && !/^\d+$/.test(w))
  .map(w => w.length > 3 ? w.replace(/(s|x)$/,"") : w);
function same(a, b){ const A = words(a), B = words(b); if (!A.length || !B.length) return false;
  if (A.every(w => B.includes(w))) return true;
  return !/\b(de|du|des|d'|à|au|aux)\b/i.test(a) && B.every(w => A.includes(w)); }
function stateOf(ing){
  if (S.items.some(i => i.status === "home" && same(ing, i.name))) return "home";
  if (S.items.some(i => i.status === "buy" && same(ing, i.name))) return "buy";
  return "miss";
}
function recipeInfo(r){
  const st = r.ingredients.map(stateOf);
  const miss = r.ingredients.filter((_, k) => st[k] === "miss");
  const home = st.every(x => x === "home");
  return {st, miss, home, label: home ? "Prête à cuisiner" : !miss.length ? "Possible après les courses" : `Il manque ${miss.length}`};
}
const sortedRecipes = () => S.recipes.map(r => [r, recipeInfo(r)]).sort((a,b) => (a[1].miss.length - b[1].miss.length) || ((b[1].home?1:0) - (a[1].home?1:0)) || a[0].name.localeCompare(b[0].name));

function eventBar(e, opts = {}){

function choreBar(c){

function noteCard(n){

  const up = S.events.filter(e => !evPast(e)).sort((a,b) => evTime(a) - evTime(b));

function studyCourses(){
  const open = S.deadlines.filter(d => !d.done).sort((a,b) => (a.due+(a.time||"23:59")).localeCompare(b.due+(b.time||"23:59")));

function studyJobs(){

function vNotes(){
  const rems = S.notes.filter(n => n.remind && !n.done).sort((a,b) => at(a.remind.date, a.remind.time) - at(b.remind.date, b.remind.time));
  const rest = S.notes.filter(n => !n.remind || n.done).sort((a,b) => b.created.localeCompare(a.created));
  let h = `<div class="section"><form class="composer" id="composer"><textarea id="noteText" placeholder="Note vite fait ce que tu ne veux pas oublier…" aria-label="Nouvelle note"></textarea>
    <button class="btn">${ic("crayon")}Noter</button></form></div>`;
  if (rems.length) h += `<div class="section"><div class="section-head"><h2>À <em>rappeler</em></h2></div><div class="list">${rems.map(noteCard).join("")}</div></div>`;
  if (rest.length) h += `<div class="section"><div class="section-head"><h2>Mes <em>notes</em></h2><span class="meta">${rest.length}</span></div><div class="list">${rest.map(noteCard).join("")}</div></div>`;
  if (!S.notes.length) h += `<div class="section"><p class="empty">Chaque note garde la date et l'heure où tu l'as écrite. Après l'avoir enregistrée, tu choisis s'il faut te la rappeler.</p></div>`;
  view.innerHTML = h;
  $("#composer").addEventListener("submit", e => {
    e.preventDefault();
    const text = $("#noteText").value.trim(); if (!text){ $("#noteText").focus(); return; }
    const n = {id:uid(), text, created:new Date().toISOString(), remind:null, done:false};
    S.notes.push(n); persist(); render(); askReminder(n);
  });
}

function addItems(text, status){
  const names = text.split(/[,;\n]/).map(s => s.trim()).filter(Boolean);
  for (const name of names){
    const ex = S.items.find(i => words(i.name).join(" ") === words(name).join(" "));
    if (ex) ex.status = status; else S.items.push({id:uid(), name, status});
  }
  if (names.length) persist();
}

/* ---------- actions ---------- */
view.addEventListener("click", onAction); $("#layer").addEventListener("click", onAction);
fab.addEventListener("click", () => openSheet({agenda:"event", etudes: subE === "stage" ? "job" : "deadline", maison:"chore"}[tab] || "recipe"));
$("#settingsBtn").addEventListener("click", openSettings);
function onAction(e){
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.go){ go(d.go, d.sub); return; }
  if (d.sub && tab === "courses"){ sub = d.sub; render(); return; }
  if (d.sube){ subE = d.sube; render(); return; }
  if (d.add){ if (d.add === "habits") openHabits(); else openSheet(d.add); return; }
  if (d.editDeadline){ openSheet("deadline", S.deadlines.find(x => x.id === d.editDeadline)); return; }
  if (d.editEvent){ openSheet("event", S.events.find(x => x.id === d.editEvent)); return; }
  if (d.editChore){ openSheet("chore", S.chores.find(x => x.id === d.editChore)); return; }
  if (d.editRecipe){ openSheet("recipe", S.recipes.find(x => x.id === d.editRecipe)); return; }
  if (d.editJob){ openSheet("job", S.jobs.find(x => x.id === d.editJob)); return; }
  if (d.editNote){ openSheet("note", S.notes.find(x => x.id === d.editNote)); return; }
  if (d.habit){
    const t = today(), log = S.habitLog[t] = (S.habitLog[t] || []).slice();
    const i = log.indexOf(d.habit); if (i >= 0) log.splice(i, 1); else log.push(d.habit);
    const cut = addDays(t, -120); for (const k of Object.keys(S.habitLog)) if (k < cut) delete S.habitLog[k];
    persist(); render();
    if (i < 0 && S.habits.every(h => habitDone(t, h.id))) toast("Toutes tes habitudes sont faites aujourd'hui !");
    return;
  }
  if (d.prep){ const [eid, pid] = d.prep.split(":"); const ev = S.events.find(x => x.id === eid), p = ev && ev.prep.find(x => x.id === pid); if (p){ p.done = !p.done; persist(); render(); if (!prepLeft(ev) && p.done) toast("Tout est prêt pour « " + ev.title + " »"); } return; }
  if (d.doneDeadline){ const x = S.deadlines.find(y => y.id === d.doneDeadline); x.done = !x.done; persist(); render(); if (x.done) toast("Marqué comme rendu", () => { x.done = false; persist(); render(); }); return; }
  if (d.doneNote){ const x = S.notes.find(y => y.id === d.doneNote); x.done = !x.done; persist(); render(); if (x.done) toast("C'est fait", () => { x.done = false; persist(); render(); }); return; }
  if (d.relance){ const j = S.jobs.find(y => y.id === d.relance), before = [j.status, j.follow]; j.status = "Relancée"; j.follow = addDays(today(), 7); persist(); render(); toast(`Relancée · prochain point ${fmtDay(j.follow)}`, () => { [j.status, j.follow] = before; persist(); render(); }); return; }
  if (d.doneChore){
    const c = S.chores.find(y => y.id === d.doneChore), before = c.next, idx = S.chores.indexOf(c);
    if (Number(c.every) > 0){ c.next = addDays(today(), Number(c.every)); persist(); render(); toast(`Fait · prochaine fois ${fmtDay(c.next)}`, () => { c.next = before; persist(); render(); }); }
    else { S.chores.splice(idx, 1); persist(); render(); toast("Fait", () => { S.chores.splice(idx, 0, c); persist(); render(); }); }
    return;
  }
  if (d.bought){ const i = S.items.find(y => y.id === d.bought); i.status = "home"; persist(); render(); toast(`${i.name} rangé dans Chez moi`, () => { i.status = "buy"; persist(); render(); }); return; }
  if (d.rebuy){ const i = S.items.find(y => y.id === d.rebuy); i.status = "buy"; persist(); render(); toast(`${i.name} ajouté à la liste`); return; }
  if (d.delItem){ const idx = S.items.findIndex(y => y.id === d.delItem), i = S.items[idx]; S.items.splice(idx,1); persist(); render(); toast(`${i.name} supprimé`, () => { S.items.splice(idx,0,i); persist(); render(); }); return; }
  if (d.addmiss){ const r = S.recipes.find(y => y.id === d.addmiss); const m = recipeInfo(r).miss; addItems(m.join(","), "buy"); render(); toast(`${m.length} ajouté${m.length > 1 ? "s" : ""} à la liste`); return; }
  if (b.id === "starter"){ S.recipes.push(...STARTER().map(r => Object.assign(r, {id:uid()}))); persist(); render(); return; }
  if (b.id === "loadEx"){ loadExamples(); return; }
}

let sheetOpen = false;

function sheetShell(title, body, lead){

  const first = $("#sheet input[type=text], #sheet textarea"); if (first && !first.value && !first.hasAttribute("data-nofocus")) setTimeout(() => first.focus(), 50);
  $$("[data-pills] button").forEach(b => b.addEventListener("click", () => {
    const g = b.parentNode;
    if (g.dataset.multi) b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"));

const delButton = () => `<button type="button" class="btn danger block" id="del">Supprimer</button>`;

      <div class="field"><label for="f-ing">Ingrédients, un par ligne</label><textarea id="f-ing" placeholder="pâtes&#10;crème&#10;fromage râpé">${esc(r.ingredients.join("\n"))}</textarea>
      <p class="hint">Écris-les comme dans ta liste de courses (« tomates », « œufs ») pour qu'ils soient reconnus.</p></div>
      <div class="actions"><button class="btn block">Enregistrer</button>${editing ? delButton() : ""}</div>`);

      e.preventDefault();

      persist(); closeSheet(); render();
    });
    bindDelete(() => S.recipes.splice(S.recipes.indexOf(item), 1));
  }
}

/* ---------- note : faut-il un rappel ? ---------- */
function quickTimes(){
  const now = new Date(), out = [];
  const in1 = new Date(now.getTime() + 60*60000); in1.setMinutes(Math.ceil(in1.getMinutes()/5)*5, 0, 0);
  out.push(["Dans 1 h", iso(in1), hm(in1)]);
  if (now.getHours() < 17) out.push(["Ce soir 18 h", today(), "18:00"]);
  if (now.getHours() < 20) out.push(["Ce soir 21 h", today(), "21:00"]);
  out.push(["Demain 9 h", addDays(today(), 1), "09:00"]);
  return out;
}
function askReminder(n){
  sheetShell("C'est un rappel ?", `
    <div class="note" style="box-shadow:none;background:var(--surface)"><span class="ico" style="width:36px;height:36px;border-radius:12px">${ic(iconOf(n, n.text, "note"))}</span><div class="main"><span class="txt">${esc(n.text)}</span><span class="when">${esc(fmtStamp(n.created))}</span></div></div>
    <div class="actions">
      <button type="button" class="btn secondary block" id="noRem">Non, juste une note</button>
      <div class="pills" style="justify-content:center">${quickTimes().map(q => `<button type="button" data-q="${q[1]}|${q[2]}">${UI.alarm}${q[0]}</button>`).join("")}</div>
      <div class="two"><input type="date" id="q-date" value="${today()}" aria-label="Date"><input type="time" id="q-time" aria-label="Heure"></div>
      <button type="button" class="btn block" id="qOk">Programmer à cette heure</button></div>`, "Tu l'as notée à " + hh(hm(new Date(n.created))) + ". Veux-tu qu'on te la rappelle ?");
  $("#noRem").addEventListener("click", () => { closeSheet(); toast("Note enregistrée"); });
  $$("[data-q]").forEach(b => b.addEventListener("click", () => { const [d, t] = b.dataset.q.split("|"); setRem(n, d, t); }));
  $("#qOk").addEventListener("click", () => { const d = $("#q-date").value, t = $("#q-time").value; if (!d || !t){ ($("#q-time")).focus(); toast("Choisis une date et une heure."); return; } setRem(n, d, t); });
}
function setRem(n, date, time){
  n.remind = {date, time}; n.done = false; persist(); render();
  sheetShell("Rappel prévu", `<div class="actions">${alarmButtons(n)}<button type="button" class="btn block" id="okDone">Terminé</button></div>`, `${esc(remTxt(n.remind))[0].toUpperCase() + esc(remTxt(n.remind)).slice(1)} : la note s'affichera en haut de l'Accueil.`);
  bindAlarmButtons(n);
  $("#okDone").addEventListener("click", closeSheet);
}
function alarmButtons(n){
  if (!STANDALONE) return `<p class="hint">Pour une vraie alarme qui sonne sur ton téléphone, utilise la version installée sur l'iPhone.</p>`;
  const mins = (at(n.remind.date, n.remind.time) - new Date()) / 60000;
  const canAlarm = mins > 0 && mins < 24*60;
  return `${canAlarm ? `<button type="button" class="btn block" id="alarmBtn">${UI.alarm}Mettre une alarme à ${esc(hh(n.remind.time))}</button>` : ""}
    <button type="button" class="btn secondary block" id="icsNote">${UI.cal}Notification via le Calendrier</button>
    <p class="hint">${canAlarm ? "L'alarme sonne comme un réveil (raccourci « " + SHORTCUT + " » à installer une fois, voir Réglages). " : "L'alarme n'est possible que pour les prochaines 24 h. "}Le Calendrier envoie une notification, sans sonnerie de réveil.</p>`;
}
function bindAlarmButtons(n){
  const a = $("#alarmBtn"); if (a) a.addEventListener("click", () => {
    const label = n.text.replace(/\s+/g, " ").slice(0, 60);
    location.href = `shortcuts://run-shortcut?name=${encodeURIComponent(SHORTCUT)}&input=text&text=${encodeURIComponent(n.remind.time + "|" + label)}`;
  });
  const c = $("#icsNote"); if (c) c.addEventListener("click", () => exportICS({id:n.id, title:n.text.replace(/\s+/g, " ").slice(0, 80), date:n.remind.date, time:n.remind.time, desc:n.text, remind:["0"]}));
}

    <div class="actions"><button type="button" class="btn block" id="habDone">Terminé</button></div>`, "Les gestes de base de chaque jour. Ils se décochent tout seuls le lendemain.");

  $$("[data-addsugg]").forEach(b => b.addEventListener("click", () => { add(b.dataset.addsugg, b.dataset.icon); openHabits(); toast("Ajoutée : " + b.dataset.addsugg); }));

/* ---------- Calendrier (.ics) ---------- */
function eventToCal(e){
  const desc = [e.place ? "Lieu : " + e.place : "", (e.prep||[]).length ? "À préparer :\n" + e.prep.map(p => "- " + p.t).join("\n") : "", e.notes].filter(Boolean).join("\n\n");
  return {id:e.id, title:e.title, date:e.date, time:e.time, place:e.place, desc, remind:e.remind || []};
}
function exportICS(c){
  const e = s => String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const day = c.date.replace(/-/g,"");
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Sapin//Organiseur//FR","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT",
    "UID:" + c.id + "@sapin", "DTSTAMP:" + stamp, "SUMMARY:" + e(c.title)];
  if (c.time) L.push("DTSTART:" + day + "T" + c.time.replace(":","") + "00", "DURATION:PT30M");
  else L.push("DTSTART;VALUE=DATE:" + day, "DTEND;VALUE=DATE:" + addDays(c.date,1).replace(/-/g,""));
  if (c.place) L.push("LOCATION:" + e(c.place));
  if (c.desc) L.push("DESCRIPTION:" + e(c.desc));
  const trig = {"1w": c.time ? "-P7D" : "-P6DT15H", "1d": c.time ? "-P1D" : "-PT15H", "2h": c.time ? "-PT2H" : "PT9H", "30m": c.time ? "-PT30M" : "PT9H", "0": c.time ? "PT0M" : "PT9H"};
  for (const t of [...new Set(c.remind.map(r => trig[r]).filter(Boolean))]) L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + e(c.title),"TRIGGER:" + t,"END:VALARM");
  L.push("END:VEVENT","END:VCALENDAR");
  const txt = L.join("\r\n");
  if (/iPhone|iPad|iPod/.test(navigator.userAgent)) { location.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(txt); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], {type:"text/calendar"}));
  a.download = (c.title.replace(/[^\p{L}\p{N} _-]/gu,"").slice(0,40) || "evenement") + ".ics"; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- toast ---------- */
let tTimer;
function toast(msg, undo){
  clearTimeout(tTimer);
  const old = $(".toast"); if (old) old.remove();
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status");
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button type="button">Annuler</button>` : ""}`;
  if (undo) t.querySelector("button").addEventListener("click", () => { undo(); t.remove(); });
  document.body.appendChild(t); tTimer = setTimeout(() => t.remove(), 4000);
}
